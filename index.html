<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今なにする？</title>
<style>
  :root {
    --paper: #faf7f0;
    --ink: #2b2b2e;
    --ink-soft: #6b6a63;
    --line: #dad3c4;
    --accent: #3b4c9e;
    --accent-soft: #e8eaf5;
    --danger: #b4483a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 24px;
    min-height: 100%;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  h1 {
    font-family: Georgia, "Hiragino Mincho ProN", serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }
  h2 { font-size: 16px; margin: 0 0 12px; color: var(--ink-soft); font-weight: 600; }

  .back {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 15px;
    padding: 6px 4px;
    cursor: pointer;
  }

  /* --- picker --- */
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 16px;
  }
  .tab {
    padding: 12px 4px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 15px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    width: 100%;
    text-align: left;
    padding: 16px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
    min-height: 52px;
  }
  .task-btn:active { background: var(--accent-soft); border-color: var(--accent); }
  .task-subject { font-size: 12px; color: var(--ink-soft); }
  .task-label { font-size: 16px; font-weight: 500; }
  .empty { color: var(--ink-soft); font-size: 14px; padding: 20px 4px; }

  #pickStatus, #scheduleStatus, #adminStatus {
    font-size: 13px;
    margin-top: 14px;
    color: var(--ink-soft);
    min-height: 18px;
  }
  .ok { color: var(--accent); }
  .error { color: var(--danger); }

  footer {
    display: flex;
    gap: 8px;
    margin-top: 28px;
    justify-content: center;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 8px 10px;
    cursor: pointer;
  }

  /* --- schedule --- */
  .schedule-item {
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 14px;
    background: #fff;
  }
  .schedule-item img { width: 100%; display: block; }
  .schedule-item p { margin: 0; padding: 8px 10px; font-size: 13px; color: var(--ink-soft); }
  .upload-box {
    border-top: 1px solid var(--line);
    margin-top: 18px;
    padding-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  input[type="text"], input[type="password"], input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font-size: 14px;
  }

  /* --- admin --- */
  .admin-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .admin-row input { font-size: 13px; padding: 8px; }
  .admin-row .checkbox-field {
    grid-column: span 2;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .admin-row .checkbox-field input { width: auto; }
  .admin-row .f-remove { grid-column: span 2; }

  /* --- records --- */
  .record-row { margin-bottom: 16px; }
  .record-top {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .record-track {
    background: var(--line);
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
  }
  .record-fill { background: var(--accent); height: 100%; }

  button.primary, button.danger, .toolbar button {
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  .toolbar { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
</style>
</head>
<body>
<main>
  <header><h1 id="viewTitle">今なにする？</h1></header>

  <!-- 画面1: 選ぶ -->
  <section id="view-picker">
    <div class="tabs" id="tabs">
      <button class="tab" data-ctx="学校">学校</button>
      <button class="tab" data-ctx="移動中">移動中</button>
      <button class="tab" data-ctx="家">家</button>
    </div>
    <div id="taskList" class="task-list"></div>
    <div id="pickStatus"></div>
  </section>

  <!-- 画面2: 小テストの予定表 -->
  <section id="view-schedule" hidden>
    <button class="back" data-back>← 戻る</button>
    <h2>小テストの予定表</h2>
    <div id="scheduleList"></div>
    <div class="upload-box">
      <input type="file" id="photoInput" accept="image/*">
      <input type="text" id="captionInput" placeholder="メモ（任意）">
      <button id="uploadBtn" class="primary">追加する</button>
    </div>
    <div id="scheduleStatus"></div>
  </section>

  <!-- 画面3: 候補の管理 -->
  <section id="view-admin" hidden>
    <button class="back" data-back>← 戻る</button>
    <h2>候補の管理</h2>
    <label class="hint" for="token">GitHub Personal Access Token</label>
    <input type="password" id="token" placeholder="このブラウザにだけ保存されます">
    <p class="hint">Fine-grained token・対象リポジトリのみ・Contents: Read and write</p>
    <div class="toolbar">
      <button id="loadBtn">読み込む</button>
      <button id="addBtn">行を追加</button>
      <button id="saveBtn" class="primary">保存する</button>
    </div>
    <div id="rows"></div>
    <div id="adminStatus"></div>
  </section>

  <!-- 画面4: 勉強時間の記録 -->
  <section id="view-records" hidden>
    <button class="back" data-back>← 戻る</button>
    <h2>今日の勉強時間</h2>
    <div id="recordsList"></div>
    <div id="recordsStatus"></div>
  </section>

  <footer id="footerNav">
    <button id="openSchedule" class="link-btn">📋 小テストの予定表</button>
    <button id="openRecords" class="link-btn">⏱ 勉強記録</button>
    <button id="openAdmin" class="link-btn">⚙️ 候補の管理</button>
  </footer>
</main>

<script>
const OWNER = "gari315";
const REPO = "gari315-study-suggestions";
const API_BASE = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const CONTEXTS = ["学校", "移動中", "家"];

function getToken() { return localStorage.getItem("gh_token") || ""; }
function setToken(v) { localStorage.setItem("gh_token", v); }
function utf8ToBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
function base64ToUtf8(str) { return decodeURIComponent(escape(atob(str))); }
function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escapeAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;"); }

async function ghGetJSON(path) {
  const token = getToken();
  const res = await fetch(API_BASE + path, {
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
  });
  if (!res.ok) throw new Error(`${path} の取得に失敗 (${res.status})`);
  const json = await res.json();
  return { data: JSON.parse(base64ToUtf8(json.content)), sha: json.sha };
}

async function ghPutJSON(path, obj, sha, message) {
  const token = getToken();
  const res = await fetch(API_BASE + path, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: message || `update ${path}`,
      content: utf8ToBase64(JSON.stringify(obj, null, 2)),
      sha: sha || undefined
    })
  });
  if (!res.ok) throw new Error(`${path} の保存に失敗 (${res.status})`);
  const json = await res.json();
  return json.content.sha;
}

async function ghPutBinary(path, base64, message) {
  const token = getToken();
  const res = await fetch(API_BASE + path, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: message || `add ${path}`, content: base64 })
  });
  if (!res.ok) throw new Error(`画像のアップロードに失敗 (${res.status})`);
  return res.json();
}

function triggerWidgetRefresh() {
  const name = encodeURIComponent("ウィジェット更新");
  window.location.href = `shortcuts://x-callback-url/run-shortcut?name=${name}`;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- 画面切り替え ---------- */
function showView(name) {
  document.getElementById("view-picker").hidden = name !== "picker";
  document.getElementById("view-schedule").hidden = name !== "schedule";
  document.getElementById("view-admin").hidden = name !== "admin";
  document.getElementById("view-records").hidden = name !== "records";
  document.getElementById("footerNav").hidden = name !== "picker";
  document.getElementById("viewTitle").textContent =
    name === "picker" ? "今なにする？" :
    name === "schedule" ? "小テストの予定表" :
    name === "records" ? "勉強時間の記録" : "候補の管理";
}

/* ---------- 画面1: 選ぶ ---------- */
let currentCtx = "学校";
let tasksCache = null;

function initPicker() {
  const hashCtx = decodeURIComponent((location.hash || "").replace("#context=", ""));
  if (CONTEXTS.includes(hashCtx)) currentCtx = hashCtx;
  document.querySelectorAll(".tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.ctx === currentCtx);
    btn.addEventListener("click", () => {
      currentCtx = btn.dataset.ctx;
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
      renderTaskList();
    });
  });
  renderTaskList();
}

async function renderTaskList() {
  const listEl = document.getElementById("taskList");
  const statusEl = document.getElementById("pickStatus");
  if (!getToken()) {
    listEl.innerHTML = "";
    statusEl.textContent = "先に「候補の管理」でトークンを設定してください";
    statusEl.className = "error";
    return;
  }
  statusEl.textContent = "読み込み中...";
  statusEl.className = "";
  try {
    if (!tasksCache) {
      const { data } = await ghGetJSON("context-tasks.json");
      tasksCache = data.tasks || [];
    }
    const items = tasksCache.filter(t => (t.contexts || []).includes(currentCtx));
    listEl.innerHTML = "";
    if (items.length === 0) {
      listEl.innerHTML = `<p class="empty">この状態向けの候補がありません</p>`;
    }
    items.forEach(t => {
      const btn = document.createElement("button");
      btn.className = "task-btn";
      btn.innerHTML = `<span class="task-subject">${escapeHtml(t.subject || "")}</span><span class="task-label">${escapeHtml(t.label)}</span>`;
      btn.addEventListener("click", () => selectTask(t));
      listEl.appendChild(btn);
    });
    statusEl.textContent = "";
  } catch (e) {
    statusEl.textContent = "読み込みに失敗しました: " + e.message;
    statusEl.className = "error";
  }
}

async function logSessionIfNeeded(oldState) {
  if (!oldState || !oldState.task || !oldState.at) return;
  const start = new Date(oldState.at);
  const minutes = Math.round((Date.now() - start.getTime()) / 60000);
  if (minutes <= 0) return;

  const taskDef = (tasksCache || []).find(t => t.id === oldState.task.id);
  const excluded = taskDef ? !!taskDef.excludeFromLog : false;

  try {
    const { data, sha } = await ghGetJSON("study-log.json");
    data.sessions = data.sessions || [];
    data.sessions.push({
      taskId: oldState.task.id,
      subject: oldState.task.subject,
      label: oldState.task.label,
      context: oldState.context,
      start: oldState.at,
      end: new Date().toISOString(),
      minutes,
      excluded
    });
    await ghPutJSON("study-log.json", data, sha, "log session");
  } catch (e) {
    // ログの保存に失敗しても選択自体は続行する(記録は副次的機能のため)
    console.warn("log save failed", e);
  }
}

async function selectTask(task) {
  const statusEl = document.getElementById("pickStatus");
  statusEl.textContent = "保存中...";
  statusEl.className = "";
  try {
    let sha = null;
    let oldState = null;
    try {
      const r = await ghGetJSON("current-state.json");
      sha = r.sha;
      oldState = r.data;
    } catch (e) {}

    await logSessionIfNeeded(oldState);

    await ghPutJSON("current-state.json", {
      context: currentCtx,
      task: { id: task.id, label: task.label, subject: task.subject },
      at: new Date().toISOString()
    }, sha, `set current: ${currentCtx} / ${task.label}`);
    statusEl.textContent = "選択しました：" + task.label;
    statusEl.className = "ok";
    setTimeout(triggerWidgetRefresh, 400);
  } catch (e) {
    statusEl.textContent = "保存に失敗しました: " + e.message;
    statusEl.className = "error";
  }
}

/* ---------- 画面2: 小テストの予定表 ---------- */
async function renderSchedule() {
  const listEl = document.getElementById("scheduleList");
  const statusEl = document.getElementById("scheduleStatus");
  if (!getToken()) { statusEl.textContent = "先に「候補の管理」でトークンを設定してください"; statusEl.className = "error"; return; }
  statusEl.textContent = "読み込み中...";
  statusEl.className = "";
  try {
    const { data } = await ghGetJSON("quiz-schedule.json");
    listEl.innerHTML = "";
    (data.items || []).slice().reverse().forEach(item => {
      const div = document.createElement("div");
      div.className = "schedule-item";
      div.innerHTML = `
        <img src="https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${item.path}" alt="">
        <p>${escapeHtml(item.caption || "")}</p>
      `;
      listEl.appendChild(div);
    });
    statusEl.textContent = "";
  } catch (e) {
    statusEl.textContent = "読み込みに失敗しました: " + e.message;
    statusEl.className = "error";
  }
}

async function uploadPhoto() {
  const fileInput = document.getElementById("photoInput");
  const captionInput = document.getElementById("captionInput");
  const statusEl = document.getElementById("scheduleStatus");
  const file = fileInput.files[0];
  if (!file) { statusEl.textContent = "写真を選んでください"; statusEl.className = "error"; return; }

  statusEl.textContent = "アップロード中...";
  statusEl.className = "";
  try {
    const base64 = await fileToBase64(file);
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = `quiz-schedule/${Date.now()}.${ext}`;
    await ghPutBinary(path, base64, "add quiz schedule photo");

    const { data, sha } = await ghGetJSON("quiz-schedule.json");
    data.items = data.items || [];
    data.items.push({ path, caption: captionInput.value.trim(), at: new Date().toISOString() });
    await ghPutJSON("quiz-schedule.json", data, sha, "update quiz-schedule.json");

    fileInput.value = "";
    captionInput.value = "";
    statusEl.textContent = "追加しました";
    statusEl.className = "ok";
    await renderSchedule();
  } catch (e) {
    statusEl.textContent = "アップロードに失敗しました: " + e.message;
    statusEl.className = "error";
  }
}

/* ---------- 画面4: 勉強時間の記録 ---------- */
async function renderRecords() {
  const listEl = document.getElementById("recordsList");
  const statusEl = document.getElementById("recordsStatus");
  if (!getToken()) { statusEl.textContent = "先に「候補の管理」でトークンを設定してください"; statusEl.className = "error"; return; }
  statusEl.textContent = "読み込み中...";
  statusEl.className = "";
  try {
    const { data } = await ghGetJSON("study-log.json");
    const todayStr = new Date().toDateString();
    const todaySessions = (data.sessions || [])
      .filter(s => !s.excluded)
      .filter(s => new Date(s.start).toDateString() === todayStr);

    const totals = {};
    todaySessions.forEach(s => { totals[s.subject] = (totals[s.subject] || 0) + s.minutes; });

    const subjects = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
    const maxMin = Math.max(1, ...Object.values(totals));

    listEl.innerHTML = "";
    if (subjects.length === 0) {
      listEl.innerHTML = `<p class="empty">今日の記録はまだありません</p>`;
    }
    subjects.forEach(subject => {
      const min = totals[subject];
      const pct = Math.round((min / maxMin) * 100);
      const row = document.createElement("div");
      row.className = "record-row";
      row.innerHTML = `
        <div class="record-top"><span>${escapeHtml(subject)}</span><span>${min}分</span></div>
        <div class="record-track"><div class="record-fill" style="width:${pct}%"></div></div>
      `;
      listEl.appendChild(row);
    });

    const totalAll = Object.values(totals).reduce((a, b) => a + b, 0);
    statusEl.textContent = `今日の合計: ${totalAll}分`;
    statusEl.className = "ok";
  } catch (e) {
    statusEl.textContent = "読み込みに失敗しました: " + e.message;
    statusEl.className = "error";
  }
}

/* ---------- 画面3: 候補の管理 ---------- */
let adminSha = null;

function makeRow(task) {
  const div = document.createElement("div");
  div.className = "admin-row";
  div.innerHTML = `
    <input type="text" class="f-label" placeholder="提案文" value="${escapeAttr(task.label || "")}">
    <input type="text" class="f-subject" placeholder="教科" value="${escapeAttr(task.subject || "")}">
    <input type="text" class="f-contexts" placeholder="状態(カンマ区切り)" value="${escapeAttr((task.contexts || []).join(", "))}">
    <input type="text" class="f-id" placeholder="ID" value="${escapeAttr(task.id || "")}">
    <label class="checkbox-field"><input type="checkbox" class="f-exclude" ${task.excludeFromLog ? "checked" : ""}> 勉強時間に含めない</label>
    <button class="danger f-remove">削除</button>
  `;
  div.querySelector(".f-remove").addEventListener("click", () => div.remove());
  return div;
}

async function loadAdminTasks() {
  const statusEl = document.getElementById("adminStatus");
  statusEl.textContent = "読み込み中...";
  statusEl.className = "";
  try {
    const { data, sha } = await ghGetJSON("context-tasks.json");
    adminSha = sha;
    const rowsEl = document.getElementById("rows");
    rowsEl.innerHTML = "";
    (data.tasks || []).forEach(t => rowsEl.appendChild(makeRow(t)));
    statusEl.textContent = `読み込み完了（${(data.tasks || []).length}件）`;
    statusEl.className = "ok";
  } catch (e) {
    statusEl.textContent = "読み込みに失敗: " + e.message;
    statusEl.className = "error";
  }
}

async function saveAdminTasks() {
  const statusEl = document.getElementById("adminStatus");
  if (!adminSha) { statusEl.textContent = "先に「読み込む」を実行してください"; statusEl.className = "error"; return; }
  const rows = Array.from(document.getElementById("rows").children);
  const tasks = rows.map(row => ({
    id: row.querySelector(".f-id").value.trim(),
    label: row.querySelector(".f-label").value.trim(),
    subject: row.querySelector(".f-subject").value.trim(),
    contexts: row.querySelector(".f-contexts").value.split(",").map(s => s.trim()).filter(Boolean),
    excludeFromLog: row.querySelector(".f-exclude").checked
  }));
  const invalid = tasks.find(t => !t.id || !t.label || t.contexts.length === 0);
  if (invalid) { statusEl.textContent = "IDと提案文と状態は必須です（空の行があります）"; statusEl.className = "error"; return; }
  statusEl.textContent = "保存中...";
  statusEl.className = "";
  try {
    adminSha = await ghPutJSON("context-tasks.json", { tasks }, adminSha, "update context-tasks.json");
    tasksCache = tasks;
    statusEl.textContent = "保存しました";
    statusEl.className = "ok";
  } catch (e) {
    statusEl.textContent = "保存に失敗: " + e.message;
    statusEl.className = "error";
  }
}

/* ---------- 初期化 ---------- */
document.getElementById("token").value = getToken();
document.getElementById("token").addEventListener("change", e => setToken(e.target.value.trim()));
document.getElementById("loadBtn").addEventListener("click", loadAdminTasks);
document.getElementById("addBtn").addEventListener("click", () => {
  document.getElementById("rows").appendChild(makeRow({ id: "task_" + Math.random().toString(36).slice(2, 8), label: "", subject: "", contexts: [] }));
});
document.getElementById("saveBtn").addEventListener("click", saveAdminTasks);
document.getElementById("uploadBtn").addEventListener("click", uploadPhoto);

document.getElementById("openSchedule").addEventListener("click", () => { showView("schedule"); renderSchedule(); });
document.getElementById("openRecords").addEventListener("click", () => { showView("records"); renderRecords(); });
document.getElementById("openAdmin").addEventListener("click", () => showView("admin"));
document.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => showView("picker")));

showView("picker");
initPicker();
</script>
</body>
</html>
