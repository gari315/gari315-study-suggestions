<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提案候補マネージャー</title>
<style>
  :root {
    --paper: #faf7f0;
    --ink: #2b2b2e;
    --ink-soft: #6b6a63;
    --line: #dad3c4;
    --accent: #3b4c9e;
    --accent-soft: #e8eaf5;
    --danger: #b4483a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  h1 {
    font-family: Georgia, "Hiragino Mincho ProN", serif;
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 32px;
  }
  section {
    margin-bottom: 32px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    font-size: 14px;
  }
  .row-fields {
    display: grid;
    grid-template-columns: 2fr 1.4fr 1.4fr 1.6fr 0.7fr auto;
    gap: 8px;
    align-items: end;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .row-fields:first-of-type { border-top: 1px solid var(--line); }
  .head-row {
    display: grid;
    grid-template-columns: 2fr 1.4fr 1.4fr 1.6fr 0.7fr auto;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    padding-bottom: 6px;
  }
  button {
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.danger {
    color: var(--danger);
    border-color: var(--danger);
    background: #fff;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  #status {
    font-size: 13px;
    margin-top: 10px;
    color: var(--ink-soft);
    white-space: pre-wrap;
  }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--accent); }
  .hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  .avoid-field {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 220px;
  }
</style>
</head>
<body>
<main>
  <h1>提案候補マネージャー</h1>
  <p class="sub">context-tasks.json を直接編集・保存します。保存すると数分以内にiPhone側の提案にも反映されます。</p>

  <section>
    <label for="token">GitHub Personal Access Token</label>
    <input type="password" id="token" placeholder="このブラウザにだけ保存されます">
    <p class="hint">Fine-grained tokenを推奨。対象リポジトリのみ、Contents: Read and write の権限で作成してください。</p>
  </section>

  <section>
    <div class="toolbar">
      <button id="loadBtn">読み込む</button>
      <button id="addBtn">行を追加</button>
      <button id="saveBtn" class="primary">保存する</button>
    </div>
    <div id="status"></div>
  </section>

  <section>
    <label for="avoidLastN">直近何件の提案を避けるか (avoidLastN)</label>
    <div class="avoid-field">
      <input type="number" id="avoidLastN" min="0" value="2">
    </div>
  </section>

  <section>
    <div class="head-row">
      <div>提案文 (label)</div>
      <div>教科 (subject)</div>
      <div>状態 (contexts, カンマ区切り)</div>
      <div>ID</div>
      <div>重み</div>
      <div></div>
    </div>
    <div id="rows"></div>
  </section>
</main>

<script>
const OWNER = "gari315";
const REPO = "gari315-study-suggestions";
const PATH = "context-tasks.json";
const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;

const tokenInput = document.getElementById("token");
const rowsEl = document.getElementById("rows");
const statusEl = document.getElementById("status");
const avoidInput = document.getElementById("avoidLastN");

let currentSha = null;

tokenInput.value = localStorage.getItem("gh_token") || "";
tokenInput.addEventListener("change", () => {
  localStorage.setItem("gh_token", tokenInput.value.trim());
});

function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function base64ToUtf8(str) {
  return decodeURIComponent(escape(atob(str)));
}

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = kind || "";
}

function makeRow(task) {
  const div = document.createElement("div");
  div.className = "row-fields";
  div.innerHTML = `
    <input type="text" class="f-label" value="${escapeAttr(task.label || "")}">
    <input type="text" class="f-subject" value="${escapeAttr(task.subject || "")}">
    <input type="text" class="f-contexts" value="${escapeAttr((task.contexts || []).join(", "))}">
    <input type="text" class="f-id" value="${escapeAttr(task.id || "")}">
    <input type="number" class="f-weight" value="${task.weight ?? 1}" min="1">
    <button class="danger f-remove">削除</button>
  `;
  div.querySelector(".f-remove").addEventListener("click", () => div.remove());
  return div;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

function slugify(label) {
  return "task_" + Math.random().toString(36).slice(2, 8);
}

document.getElementById("addBtn").addEventListener("click", () => {
  rowsEl.appendChild(makeRow({ id: slugify(""), label: "", subject: "", contexts: [], weight: 1 }));
});

document.getElementById("loadBtn").addEventListener("click", loadData);
document.getElementById("saveBtn").addEventListener("click", saveData);

async function loadData() {
  const token = tokenInput.value.trim();
  if (!token) { setStatus("先にトークンを入力してください", "error"); return; }
  setStatus("読み込み中...");
  try {
    const res = await fetch(API_URL, {
      headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
    });
    if (!res.ok) throw new Error(`GitHub API エラー: ${res.status}`);
    const json = await res.json();
    currentSha = json.sha;
    const data = JSON.parse(base64ToUtf8(json.content));
    avoidInput.value = data.avoidLastN ?? 2;
    rowsEl.innerHTML = "";
    (data.tasks || []).forEach(t => rowsEl.appendChild(makeRow(t)));
    setStatus(`読み込み完了（${(data.tasks || []).length}件）`, "ok");
  } catch (e) {
    setStatus("読み込みに失敗しました: " + e.message, "error");
  }
}

async function saveData() {
  const token = tokenInput.value.trim();
  if (!token) { setStatus("先にトークンを入力してください", "error"); return; }
  if (!currentSha) { setStatus("先に「読み込む」を実行してください", "error"); return; }

  const tasks = Array.from(rowsEl.children).map(row => ({
    id: row.querySelector(".f-id").value.trim(),
    label: row.querySelector(".f-label").value.trim(),
    subject: row.querySelector(".f-subject").value.trim(),
    contexts: row.querySelector(".f-contexts").value.split(",").map(s => s.trim()).filter(Boolean),
    weight: Number(row.querySelector(".f-weight").value) || 1
  }));

  const invalid = tasks.find(t => !t.id || !t.label || t.contexts.length === 0);
  if (invalid) { setStatus("IDと提案文と状態は必須です（空の行があります）", "error"); return; }

  const data = { avoidLastN: Number(avoidInput.value) || 0, tasks };
  const content = utf8ToBase64(JSON.stringify(data, null, 2));

  setStatus("保存中...");
  try {
    const res = await fetch(API_URL, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "update context-tasks.json",
        content,
        sha: currentSha
      })
    });
    if (!res.ok) throw new Error(`GitHub API エラー: ${res.status}`);
    const json = await res.json();
    currentSha = json.content.sha;
    setStatus("保存しました", "ok");
  } catch (e) {
    setStatus("保存に失敗しました: " + e.message, "error");
  }
}
</script>
</body>
</html>
